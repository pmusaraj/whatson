name: Refresh UHF EPG data

on:
  schedule:
    # Every two days at 03:35 UTC.
    - cron: "35 3 */2 * *"
  workflow_dispatch:

jobs:
  refresh-uhf:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare web build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
