name: Weekly series report

on:
  schedule:
    - cron: "25 8 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate this week's report even if it already exists
        type: boolean
        default: false
      dry_run:
        description: Generate and validate everything but skip the deploy
        type: boolean
        default: false

# Share the guide writer's lock: neither data job should race the other's deploy.
concurrency:
  group: refresh-epg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the latest branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restore cached guide snapshots
        # Guide data is generated, not committed (option B history cleanup).
        # Rebuild the deployable web tree offline from the latest snapshots.
        uses: actions/cache/restore@v4
        with:
          path: |
            data/normalized
            web/data/uhf
            web/data/editors-picks.json
          key: guide-data-${{ github.run_id }}
          restore-keys: guide-data-

      - name: Test report generation
        run: python3 -m unittest discover -s tests -p 'test_build_series_report.py' -v

      - name: Generate weekly report
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          FORCE_REPORT: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$FORCE_REPORT" == "true" ]]; then args+=(--force); fi
          python3 scripts/build_series_report.py "${args[@]}"

      - name: Rebuild deployable web data from cache
        run: |
          python3 scripts/build_web_data.py
          if [[ -f web/data/editors-picks.json ]]; then
            python3 scripts/build_editor_picks_html.py
          else
            echo "::warning::editors-picks.json not in cache; shipping index without refreshed pick embeds"
          fi
          python3 scripts/build_series_report.py --render-only

      - name: Upload report for inspection
        uses: actions/upload-artifact@v4
        with:
          name: weekly-series-report
          path: |
            web/data/series.json
            web/series/index.html
          retention-days: 14

      - name: Commit weekly report
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/series.json web/series/index.html data/series/reports
          if git diff --cached --quiet; then
            echo "No weekly series changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh weekly series report"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.commit.outputs.changed == 'true' && !inputs.dry_run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler deploy
