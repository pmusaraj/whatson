name: Refresh EPG data

on:
  schedule:
    # Main + UHF guide refresh. Once daily; UHF grabs 4 days to keep 24h+ ahead.
    - cron: "5 5 * * *"
  workflow_dispatch:
    inputs:
      countries:
        description: Limit the grab to these country codes, e.g. "BR CA"
        type: string
        default: ""
      dry_run:
        description: Generate and validate everything but skip the deploy
        type: boolean
        default: false

# History cleanup (option B): guide snapshots are generated, never committed.
# This workflow grabs both feeds, rebuilds web/data offline, and deploys the
# site directly with wrangler. Requires secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Cloudflare dashboard auto-builds from git must stay
# OFF: a git checkout has no guide data, so a dashboard build would ship an
# empty guide.
concurrency:
  group: refresh-epg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Restore cached guide snapshots
        id: cache
        uses: actions/cache/restore@v4
        with:
          # Previous grab output: fallback when a source grab fails, and the
          # inputs for the offline web/data rebuild. web/data/series.json is
          # tracked in git and intentionally not cached. Editor picks are
          # owned by the separate Editor picks workflow, so picks are fetched
          # live before deploy (below) instead of being cached here: sharing
          # one cache key prefix let this job redeploy stale picks over fresh
          # ones (guide-data-* collision).
          path: |
            data/normalized
            web/data/uhf
          key: guide-snapshots-${{ github.run_id }}
          restore-keys: guide-snapshots-

      - name: Install iptv-org EPG grabber
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git .cache/epg
          npm install --prefix .cache/epg

      - name: Refresh guide data
        run: |
          # Editor picks are owned by the separate Editor picks workflow,
          # which reads the deployed payloads. This job never rewrites picks;
          # the live picks file is fetched below so this deploy does not
          # clobber fresh picks with the stale copy committed in git.
          args=(--skip-editor-picks)
          if [[ -n "${{ inputs.countries }}" ]]; then args+=(--countries ${{ inputs.countries }}); fi
          python3 scripts/refresh_epg.py "${args[@]}"

      - name: Refresh UHF EPG data
        run: |
          args=()
          if [[ -n "${{ inputs.countries }}" ]]; then args+=(--countries ${{ inputs.countries }}); fi
          python3 scripts/refresh_uhf_epg.py "${args[@]}"

      - name: Fetch live editor picks
        run: |
          # Ship the currently deployed (fresh) picks instead of the stale
          # copy committed in git. Picks refresh 4x daily via the Editor
          # picks workflow; this job must not roll them back.
          if curl -sf --retry 3 --max-time 60 https://heywhatson.tv/data/editors-picks.json -o web/data/editors-picks.json; then
            echo "live editors-picks.json fetched"
          else
            echo "::warning::live editors-picks.json fetch failed; shipping committed copy"
          fi

      - name: Render picks and series pages
        run: |
          python3 scripts/build_editor_picks_html.py
          python3 scripts/build_series_report.py --render-only

      - name: Validate deployable guide data
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path

          web_data = Path("web/data")
          countries = json.loads((web_data / "countries.json").read_text())["countries"]
          assert countries, "countries.json has no countries"
          total = 0
          for entry in countries:
              for key in ("dataUrl", "premiumDataUrl"):
                  path = Path("web") / entry[key]
                  assert path.exists(), f"missing {path}"
                  payload = json.loads(path.read_text())
                  total += payload.get("channelCount", 0)
          print(f"countries={len(countries)} totalChannels={total}")
          assert total > 100, f"suspiciously few channels: {total}"

          for name in ("editors-picks.json", "series.json"):
              json.loads((web_data / name).read_text())
              print(f"{name} ok")

          summary = web_data / "uhf" / "summary.json"
          if summary.exists():
              print("uhf summary ok:", json.loads(summary.read_text()).get("generatedAt"))
          else:
              print("::warning::web/data/uhf/summary.json missing (no UHF output this run)")
          EOF

      - name: Save guide snapshots to cache
        uses: actions/cache/save@v4
        with:
          path: |
            data/normalized
            web/data/uhf
          key: guide-snapshots-${{ github.run_id }}

      - name: Deploy to Cloudflare Workers
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler deploy

      - name: Delete generated build artifacts
        if: always()
        run: |
          rm -rf .cache node_modules __pycache__ scripts/__pycache__ tests/__pycache__
