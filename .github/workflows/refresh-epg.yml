name: Refresh EPG data

on:
  schedule:
    - cron: "5 */12 * * *"
  workflow_dispatch:
    inputs:
      editors_only:
        description: Rebuild only editor picks from the checked-in guide data
        type: boolean
        default: false

concurrency:
  group: refresh-epg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        if: ${{ !inputs.editors_only }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install iptv-org EPG grabber
        if: ${{ !inputs.editors_only }}
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git .cache/epg
          npm install --prefix .cache/epg

      - name: Refresh guide data
        if: ${{ !inputs.editors_only }}
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: python3 scripts/refresh_epg.py

      - name: Rebuild editor picks
        if: ${{ inputs.editors_only }}
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: python3 scripts/build_editor_picks.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normalized web/data
          if git diff --cached --quiet; then
            echo "No guide data changes to commit."
          else
            git commit -m "chore: refresh EPG data"
            git push
          fi

      - name: Delete generated build artifacts
        if: always()
        run: |
          rm -rf .cache node_modules __pycache__ scripts/__pycache__ tests/__pycache__
